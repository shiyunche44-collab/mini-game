# 每次推送、每个指向 main 的 PR 都跑 npm run check：架构检查、类型检查、单元测试。
# 本地和 CI 跑的是同一条命令，CI 红了就在本地跑 npm run check 复现。
name: check

on:
  push:
  pull_request:
    branches: [main]

# 同一个分支连续推送时，取消还没跑完的旧任务
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # package.json 的 engines 要求 node >= 22.18（测试直接用 node 运行 .ts）
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
